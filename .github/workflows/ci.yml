name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    name: Lint · Typecheck · Test · Build
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        node: [22, 24, 26]

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Use Node.js ${{ matrix.node }}
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Typecheck
        run: npm run typecheck

      - name: Verify TypeScript API compatibility
        run: npm run typecheck:legacy

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

      - name: Verify release metadata and bundles
        run: npm run check:release

      - name: Verify committed bundles are current
        run: git diff --exit-code -- dist/cli.js dist/mcp-server.js

      - name: Verify packed installation
        run: npm run smoke:release

      - name: Verify bundled CLI runs
        run: node dist/cli.js --help

      - name: Verify portable JSON export
        run: node dist/cli.js --file tests/fixtures/minimal-session.jsonl --no-llm --json > tree.json

      - name: Audit dependency advisories
        run: npm audit
